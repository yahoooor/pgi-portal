version: '3.6'

services:
  nginx:
    image: nginx-pig
    build: ./portal-pgi
    restart: always
    environment:
      NODE_ENV: production
    volumes:
      - ./portal-pgi/nginx.conf:/etc/nginx/conf.d/nginx.conf
    ports:
      - 8081:81
    networks:
      - default

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    networks:
      - default
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 20s
      timeout: 10s
      retries: 3

  redis:
    image: 'bitnami/redis:latest'
    restart: always
    ports:
      - "6379:6379"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - default

  flower:
    image: mher/flower:1.2
    restart: always
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=amqp://guest@rabbitmq:5672//
      - FLOWER_PORT=5555
    networks:
      - default

  workers:
    build:
      context: ./pig-backend
      dockerfile: Dockerfile
    command: Workers
    restart: always
    environment:
      # common
      - LOG_LEVEL=20
      - CELERY_BROKER_URL=pyamqp://guest:guest@rabbitmq:5672
      - CELERY_BACKEND_URL=redis://redis:6379/0
      - RESULT_SERIALIZER=pickle
      - TASK_SERIALIZER=pickle
      - ACCEPT_CONTENT=["pickle","json"]
      # celery workers
      - CELERY_WORKERS=20
      - IMPORTS=["src.tasks"]
      - BROKER_HEARTBEAT=120
      - CELERY_CONSUME_QUEUES=["celery"]
    networks:
      - default

  restapi:
    build:
      context: ./pig-backend
      dockerfile: Dockerfile
    command: RestApi
    restart: always
    ports:
    - "5000:5000"
    environment:
      # common
      - LOG_LEVEL=20
      - CELERY_BROKER_URL=pyamqp://guest:guest@rabbitmq:5672
      - CELERY_BACKEND_URL=redis://redis:6379/0
      - RESULT_SERIALIZER=pickle
      - TASK_SERIALIZER=pickle
      - ACCEPT_CONTENT=["pickle","json"]
      # restapi
      - REST_HOST=0.0.0.0
      - REST_PORT=5000
      - REST_WORKERS=2
    networks:
      - default
      

networks:
  default:
    attachable: True

volumes:
    shared_static:
