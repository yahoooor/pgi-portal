<div class="service-title"> 
    Adres usługi WFS:
</div>
<div class="url-container">
    <span class="p-input-icon-right">
        <i *ngIf="searchingWfs" class="pi pi-spin pi-spinner" ></i>
        <input type="text" pInputText [(ngModel)]="urlWfs" (ngModelChange)=wfsInputChange() />
    </span>
    <span style="margin-left: 5px;">
        <i *ngIf="urlWfs" class="pi pi-times" (click)="cancelSearching(); urlWfs=''"></i>
    </span>

</div>

<br>
<div>
    <p-checkbox [inputId]="'coords'" [binary]="true" name="groupname" [value]="false" [(ngModel)]="invertedCoordinates" ></p-checkbox>
    <label [for]="'coords'"> Zamień współrzędne</label>
</div>

<div class="wfs-results">
    <div class="results-title">
        <strong *ngIf="wfsGroupTitle">{{ wfsGroupTitle }}:</strong>
    </div>
    
    <div class="results-container">
        <div *ngFor="let layer of wfsLayers; let i = index" class="result-item">
            <p-checkbox [binary]="true" name="groupname" [value]="false" [(ngModel)]="layer.isSelected" (onChange)="onLayerCheckboxChange($event, layer)"></p-checkbox>

            <div class="layer-result">{{ layer.Title }} </div>
        </div>
    </div>
</div>

<div *ngIf="wfsLayers.length" class="result-button">
    <button pButton type="button" label="DODAJ" class="p-button-rounded" (click)="addLayers()"></button>
</div>
